server:
  port: ${PORT:8080}

spring:
  application:
    name: rankgit-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rankgit}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:Ov23liXXXXXXXXXX}
            client-secret: ${GITHUB_CLIENT_SECRET:your_client_secret_here}
            scope:
              - read:user
              - user:email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  jwt:
    secret: ${JWT_SECRET:rankgitSuperSecretJwtKeyMustBeAtLeast256BitsLongForHMACSHA256!}
    expiration-ms: 86400000 # 24 hours
  oauth2:
    authorized-redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:4200/oauth2/redirect}
  github:
    # Public token for API rate limit boosting (5000 req/h)
    api-token: ${GITHUB_API_TOKEN:}
    initial-admin-username: ${INITIAL_ADMIN_USERNAME:carlosbfm}
