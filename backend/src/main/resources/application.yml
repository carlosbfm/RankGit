server:
  port: 8080

spring:
  application:
    name: rankgit-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rankgit}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:Ov23liXXXXXXXXXX}
            client-secret: ${GITHUB_CLIENT_SECRET:your_client_secret_here}
            scope:
              - read:user
              - user:email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

app:
  jwt:
    secret: ${JWT_SECRET:rankgitSuperSecretJwtKeyMustBeAtLeast256BitsLongForHMACSHA256!}
    expiration-ms: 86400000 # 24 hours
  oauth2:
    authorized-redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:4200/oauth2/redirect}
  github:
    # Public token for API rate limit boosting (5000 req/h)
    api-token: ${GITHUB_API_TOKEN:}
    initial-admin-username: ${INITIAL_ADMIN_USERNAME:carlosbfm}
